apiVersion: batch/v1
kind: Job
metadata:
  name: quantserve-download
  namespace: quantserve
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: download
          image: huzjie/quantserve:latest
          command: ["quantserve", "download", "qwen/qwen3.8-2.4t-a95b", "--mirror", "modelscope"]
          volumeMounts:
            - name: models
              mountPath: /root/.quantserve/models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: quantserve-models
